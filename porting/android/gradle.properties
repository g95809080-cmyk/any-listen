# Gradle 守护进程内存：AGP + Kotlin 2.x 编译 4 个模块的实测需要 3G 以上
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# AndroidX（必须）
android.useAndroidX=true
# 非传递 R 类，减小 dex 与编译期符号表
android.nonTransitiveRClass=true
# 关闭 AGP 的依赖分析提示噪音
android.suppressUnsupportedCompileSdk=35

# 工程路径含中文（任何 Listen移植apk），AGP 默认拒绝；实测 aapt2/JDK17 可以处理，
# 但保留这条开关的同时，README 里给出「ASCII 目录 junction」的替代路径（更稳）。
android.overridePathCheck=true

kotlin.code.style=official
kotlin.incremental=true
