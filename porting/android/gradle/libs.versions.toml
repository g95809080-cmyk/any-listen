[versions]
# AGP 8.13.x 为 8.x 末代稳定版，requires Gradle >= 8.13（本工程用 8.14.3），JDK 17。
agp = "8.13.2"
kotlin = "2.2.10"
# compileSdk 35 下可用的最新稳定组合（androidx 1.16+/core 1.18 起要求 compileSdk 36，故锁定 1.15.0）
coreKtx = "1.15.0"
activity = "1.9.3"
lifecycle = "2.8.7"
androidxMedia = "1.7.0"
okhttp = "4.12.0"
coroutines = "1.9.0"
commonsCompress = "1.27.1"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-media = { module = "androidx.media:media", version.ref = "androidxMedia" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
